<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Bebas+Neue&display=swap');

  :root {
    --bg: #f5f0e8;
    --surface: #ffffff;
    --border: #ddd8cc;
    --accent: #1a1a1a;
    --accent2: #c8440a;
    --text: #1a1a1a;
    --muted: #888;
    --success: #2d7a3a;
    --danger: #c8440a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 1.25rem 1.25rem 1rem;
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    line-height: 1;
    color: white;
  }
  header h1 span { color: var(--accent2); }

  #loginBtn {
    background: var(--accent2);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  #loginBtn:hover { opacity: 0.85; }
  #loginBtn.logged-in { background: var(--success); cursor: default; }
  #loginStatus { font-size: 0.65rem; color: #aaa; text-align: right; margin-top: 2px; }

  main {
    flex: 1;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .setup-card.done { border-color: var(--success); }
  .setup-card-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .setup-card.done .setup-card-title { color: var(--success); }

  .input-row { display: flex; gap: 0.5rem; align-items: center; }

  .field-value {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.4rem 0.6rem;
    font-size: 0.8rem;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    width: 100%;
    transition: border-color 0.15s;
  }
  .field-value:focus { outline: none; border-color: var(--accent2); }
  .field-value.amount { color: var(--accent2); font-weight: 500; }

  .btn-small {
    background: var(--accent2);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.2s;
  }
  .btn-small:hover { opacity: 0.85; }
  .btn-small.ghost { background: none; border: 1px solid var(--border); color: var(--muted); }

  .hint-text { font-size: 0.65rem; color: var(--muted); line-height: 1.5; }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: var(--surface);
  }
  .upload-zone:hover, .upload-zone.drag-over { border-color: var(--accent2); background: #fff8f5; }
  .upload-zone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .upload-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  .upload-zone p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
  .upload-zone .hint { margin-top: 0.5rem; font-size: 0.7rem; color: var(--accent2); }

  .scan-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .scan-card-header {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); background: #fafaf8;
  }
  .scan-card img { width: 52px; height: 52px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; }
  .scan-card-info { flex: 1; min-width: 0; }
  .scan-card-filename { font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scan-card-status { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .scan-card-status.scanning { color: #c8880a; }
  .scan-card-status.done { color: var(--success); }
  .scan-card-status.error { color: var(--danger); }

  .scan-card-body { padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }

  .field-row { display: grid; grid-template-columns: 90px 1fr; gap: 0.5rem; align-items: center; }
  .field-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }

  .remove-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0.25rem; border-radius: 4px; transition: color 0.15s; flex-shrink: 0; }
  .remove-btn:hover { color: var(--danger); }

  .pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c8880a; animation: pulse 1s infinite; margin-right: 0.4rem; vertical-align: middle; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }

  .summary-bar { background: var(--accent); color: white; border-radius: 12px; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; }
  .summary-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.07em; }
  .summary-total { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: white; }
  .summary-count { font-size: 0.65rem; color: #aaa; text-align: right; }

  .btn-primary { background: var(--accent2); color: white; border: none; border-radius: 10px; padding: 0.9rem 1.5rem; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%; }
  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-secondary { background: none; border: 1px solid var(--border); border-radius: 10px; color: var(--muted); padding: 0.6rem; font-family: 'DM Mono', monospace; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; width: 100%; text-align: center; }
  .btn-secondary:hover { border-color: var(--danger); color: var(--danger); }

  .separator { height: 1px; background: var(--border); margin: 0.25rem 0; }

  #toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: white; padding: 0.75rem 1.5rem; border-radius: 30px; font-size: 0.8rem; transition: transform 0.3s ease; z-index: 999; white-space: nowrap; }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }
  #toast.error { background: var(--danger); }

  /* Lightbox */
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1000; align-items:center; justify-content:center; }
  .lightbox.open { display:flex; }
  .lightbox img { max-width:95vw; max-height:92vh; object-fit:contain; border-radius:8px; }
  .lightbox-close { position:fixed; top:1rem; right:1rem; background:white; border:none; border-radius:50%; width:2rem; height:2rem; font-size:1rem; cursor:pointer; line-height:2rem; text-align:center; }
</style>
</head>
<body>

<header>
  <div><h1>BON<span>.</span>SCAN</h1></div>
  <div style="text-align:right">
    <button id="loginBtn" onclick="handleLogin()">🔐 Mit Google anmelden</button>
    <div id="loginStatus">nicht angemeldet</div>
  </div>
</header>

<main>

  <!-- API Key -->
  <div class="setup-card" id="apiKeyCard">
    <div class="setup-card-title" id="apiKeyTitle">🤖 Anthropic API Key</div>
    <div class="input-row">
      <input id="apiKeyInput" type="password" class="field-value" placeholder="sk-ant-...">
      <button class="btn-small" onclick="saveApiKey()">Speichern</button>
      <button class="btn-small ghost" id="apiKeyEditBtn" onclick="editApiKey()" style="display:none">Ändern</button>
    </div>
    <div class="hint-text">Einmalig eingeben · lokal gespeichert · <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent2)">console.anthropic.com</a></div>
  </div>

  <!-- Google -->
  <div class="setup-card" id="googleCard">
    <div class="setup-card-title" id="googleTitle">📊 Google Sheets</div>
    <div class="hint-text" id="googleHint">Oben anmelden um Einträge direkt in Sheets zu speichern.</div>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="upload-icon">📷</div>
    <p>Foto aufnehmen oder aus Galerie wählen</p>
    <p class="hint">Kamera · Galerie · Mehrere gleichzeitig möglich</p>
  </div>

  <div id="cardsContainer"></div>

  <div class="summary-bar" id="summaryBar" style="display:none">
    <div>
      <div class="summary-label">Gesamt</div>
      <div class="summary-count" id="countLabel">0 Belege</div>
    </div>
    <div class="summary-total" id="totalAmount">0,00 €</div>
  </div>

  <button class="btn-primary" id="saveBtn" disabled onclick="saveToSheets()">
    📊 In Google Sheets speichern
  </button>
  <button class="btn-secondary" id="clearBtn" style="display:none" onclick="clearAll()">
    Alles löschen
  </button>
</main>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="Bon">
</div>

<div id="toast"></div>

<script>
const CLIENT_ID = '829620952076-02bue5il4lq8dn8r8n4g7e3t2t31u57a.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
const SHEET_NAME = 'Receipt Scanner Data';
const FOLDER_NAME = 'Finance';
const ANTHROPIC_URL = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-20250514';

let accessToken = null;
let anthropicKey = localStorage.getItem('anthropic_api_key') || '';
let entries = [];
let nextId = 1;
let spreadsheetId = null;
let vendorList = [];

// ── API KEY ──
function initApiKey() {
  if (!anthropicKey) return;
  document.getElementById('apiKeyInput').value = '••••••••••••••••';
  document.getElementById('apiKeyInput').disabled = true;
  document.getElementById('apiKeyCard').classList.add('done');
  document.getElementById('apiKeyTitle').textContent = '✓ Anthropic API Key gesetzt';
  document.getElementById('apiKeyEditBtn').style.display = 'inline-block';
}

function saveApiKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val.startsWith('sk-ant-')) { showToast('Ungültiger Key — muss mit sk-ant- beginnen', 'error'); return; }
  anthropicKey = val;
  localStorage.setItem('anthropic_api_key', val);
  document.getElementById('apiKeyInput').value = '••••••••••••••••';
  document.getElementById('apiKeyInput').disabled = true;
  document.getElementById('apiKeyCard').classList.add('done');
  document.getElementById('apiKeyTitle').textContent = '✓ Anthropic API Key gesetzt';
  document.getElementById('apiKeyEditBtn').style.display = 'inline-block';
  showToast('API Key gespeichert', 'success');
  updateSaveBtn();
}

function editApiKey() {
  anthropicKey = '';
  localStorage.removeItem('anthropic_api_key');
  document.getElementById('apiKeyInput').value = '';
  document.getElementById('apiKeyInput').disabled = false;
  document.getElementById('apiKeyCard').classList.remove('done');
  document.getElementById('apiKeyTitle').textContent = '🤖 Anthropic API Key';
  document.getElementById('apiKeyEditBtn').style.display = 'none';
}

// ── GOOGLE AUTH ──
function handleLogin() {
  if (accessToken) return;
  const redirectUri = window.location.href.split('#')[0];
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: redirectUri,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true'
  });
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
}

function checkAuthCallback() {
  const hash = window.location.hash;
  if (!hash) return;
  const params = new URLSearchParams(hash.replace('#', '?'));
  const token = params.get('access_token');
  if (token) {
    accessToken = token;
    window.history.replaceState({}, document.title, window.location.pathname);
    onLoggedIn();
  }
}

function onLoggedIn() {
  document.getElementById('loginBtn').textContent = '✓ Angemeldet';
  document.getElementById('loginBtn').classList.add('logged-in');
  document.getElementById('loginStatus').textContent = 'Google Sheets bereit';
  document.getElementById('googleCard').classList.add('done');
  document.getElementById('googleTitle').textContent = '✓ Google Sheets verbunden';
  document.getElementById('googleHint').innerHTML = 'Einträge werden in &quot;Receipt Scanner Data&quot; gespeichert.';
  // Link wird nach getOrCreateSheet() gesetzt
  updateSaveBtn();
  loadVendorList();
}

// vendorMap: { "Edeka": ["Zurheide", "Frischemarkt Mueller"], ... }
let vendorMap = {};

async function loadVendorList() {
  try {
    const sheetId = await getOrCreateSheet();
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/Haendler!A:B`,
      { headers: { 'Authorization': `Bearer ${accessToken}` } }
    );
    const data = await res.json();
    if (data.values) {
      vendorMap = {};
      vendorList = [];
      data.values.forEach(row => {
        const name = (row[0] || '').trim();
        if (!name) return;
        vendorList.push(name);
        const aliases = (row[1] || '').split(',').map(a => a.trim()).filter(Boolean);
        vendorMap[name] = aliases;
      });
      if (vendorList.length > 0) {
        document.getElementById('googleHint').innerHTML =
          `${vendorList.length} Haendler geladen &nbsp;·&nbsp; <a href="https://docs.google.com/spreadsheets/d/${sheetId}" target="_blank" style="color:var(--accent2);text-decoration:none;font-weight:500">Sheets oeffnen ↗</a>`;
      }
    }
  } catch (err) {
    console.log('Haendlerliste nicht geladen:', err);
  }
}

// ── FILES ──
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag-over'); handleFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', () => { handleFiles([...fileInput.files]); fileInput.value = ''; });

function handleFiles(files) {
  if (!anthropicKey) { showToast('Bitte zuerst Anthropic API Key eingeben', 'error'); return; }
  files.filter(f => f.type.startsWith('image/')).forEach(processFile);
}

async function toBase64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });
}
async function toThumb(file) {
  return new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); });
}

// ── SCAN ──
async function processFile(file) {
  const thumb = await toThumb(file);

  // Placeholder card while scanning
  const placeholderId = nextId++;
  const placeholder = { id: placeholderId, filename: file.name, thumb, date: '', vendor: '', amount: '', ort: '', note: '', status: 'scanning' };
  entries.push(placeholder);
  renderCard(placeholder);
  updateSummary();

  try {
    const b64 = await toBase64(file);
    const res = await fetch(ANTHROPIC_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': anthropicKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 2000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: b64 } },
            { type: 'text', text: (() => {
              let vendorHint = 'Marktname z.B. Netto, Lidl, Aldi, Rewe, Famila, Edeka, Penny, Kaufland.';
              if (vendorList.length > 0) {
                const aliasLines = vendorList.map(v => {
                  const aliases = vendorMap[v] && vendorMap[v].length > 0 ? ' (auch bekannt als: ' + vendorMap[v].join(', ') + ')' : '';
                  return v + aliases;
                }).join('; ');
                vendorHint = 'Waehle den vendor-Namen EXAKT aus dieser Liste: ' + aliasLines + '. Nutze den Hauptnamen (vor der Klammer). Wenn kein Name passt, verwende den erkannten Marktnamen.';
              }
              return `Analysiere dieses Foto sorgfaeltig. Es koennen ein oder mehrere Kassenbons abgebildet sein.
Antworte NUR mit einem JSON-Array, ohne Markdown, ohne Erklaerung.
Fuer jeden Bon ein SEPARATES Objekt - lies die Felder DIREKT vom jeweiligen Bon ab:
[{
  "date": "Datum dieses Bons als YYYY-MM-DD - direkt vom Bon ablesen",
  "vendor": "${vendorHint}",
  "amount": "Gesamtbetrag dieses Bons als Zahl z.B. 9.32",
  "ort": "Name der Filiale oder des Ladens laut Bon-Kopf z.B. Lidl Quickborn oder nur Lidl",
  "zahler": "Zahlungsmittel falls erkennbar: z.B. EC ****1234 oder Visa ****5678 - nur die letzten 4 Ziffern und Kartentyp. Falls bar oder nicht erkennbar: leer lassen",
  "handschrift": "Handschriftliche Notizen auf dem Bon falls vorhanden sonst leer"
}]
Wenn kein Bon erkennbar: leeres Array [].
WICHTIG: Jeder Bon hat sein EIGENES Datum - nicht kopieren!`;
            })() }
          ]
        }]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = (data.content?.[0]?.text || '[]').replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(raw);
    const bons = Array.isArray(parsed) ? parsed : [parsed];

    // Remove placeholder
    entries = entries.filter(e => e.id !== placeholderId);
    document.getElementById('card-' + placeholderId)?.remove();

    if (bons.length === 0) {
      showToast('Kein Bon auf dem Foto erkannt', 'error');
      updateSummary();
      return;
    }

    bons.forEach((bon, idx) => {
      const id = nextId++;
      const entry = {
        id,
        filename: bons.length > 1 ? file.name + ' (' + (idx+1) + '/' + bons.length + ')' : file.name,
        thumb,
        date: bon.date || '',
        vendor: bon.vendor || '',
        amount: bon.amount ? String(bon.amount) : '',
        ort: bon.ort || '',
        zahler: bon.zahler || '',
        note: bon.handschrift ? 'Einkauf - ' + bon.handschrift : 'Einkauf',
        status: 'done'
      };
      entries.push(entry);
      renderCard(entry);
    });

  } catch (err) {
    const ph = entries.find(e => e.id === placeholderId);
    if (ph) { ph.status = 'error'; ph.note = err.message || 'Scan fehlgeschlagen'; updateCard(ph); }
    console.error(err);
  }

  updateSummary();
}

// ── RENDER ──
function renderCard(entry) {
  const div = document.createElement('div');
  div.className = 'scan-card';
  div.id = `card-${entry.id}`;
  div.innerHTML = cardHTML(entry);
  document.getElementById('cardsContainer').appendChild(div);
}

function updateCard(entry) {
  const div = document.getElementById(`card-${entry.id}`);
  if (div) div.innerHTML = cardHTML(entry);
}

function cardHTML(entry) {
  const statusText = { scanning: `<span class="pulse"></span>Wird gescannt…`, done: '✓ Erfasst', error: `✗ ${esc(entry.note)}` }[entry.status];
  const fields = entry.status === 'scanning' ? '' : `
    <div class="separator"></div>
    <div class="field-row"><span class="field-label">Datum</span><input class="field-value" type="date" value="${entry.date}" onchange="updateField(${entry.id},'date',this.value)"></div>
    <div class="field-row"><span class="field-label">Händler</span><input class="field-value" type="text" value="${esc(entry.vendor)}" placeholder="Marktname" onchange="updateField(${entry.id},'vendor',this.value)"></div>
    <div class="field-row"><span class="field-label">Betrag €</span><input class="field-value amount" type="number" step="0.01" value="${entry.amount}" placeholder="0.00" onchange="updateField(${entry.id},'amount',this.value)"></div>
    <div class="field-row"><span class="field-label">Filiale</span><input class="field-value" type="text" value="${esc(entry.ort)}" placeholder="Filialname" onchange="updateField(${entry.id},'ort',this.value)"></div>
    <div class="field-row"><span class="field-label">Zahler</span><input class="field-value" type="text" value="${esc(entry.zahler||'')}" placeholder="EC ****1234" onchange="updateField(${entry.id},'zahler',this.value)"></div>
    <div class="field-row"><span class="field-label">Bemerkung</span><input class="field-value" type="text" value="${esc(entry.note)}" placeholder="Einkauf" onchange="updateField(${entry.id},'note',this.value)"></div>`;

  return `
    <div class="scan-card-header">
      <img src="${entry.thumb}" alt="Bon" onclick="openLightbox('${entry.thumb}')" style="cursor:zoom-in">
      <div class="scan-card-info">
        <div class="scan-card-filename">${esc(entry.filename)}</div>
        <div class="scan-card-status ${entry.status}">${statusText}</div>
      </div>
      <button class="remove-btn" onclick="removeEntry(${entry.id})">✕</button>
    </div>
    ${entry.status !== 'scanning' ? `<div class="scan-card-body">${fields}</div>` : ''}`;
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function updateField(id, field, value) {
  const e = entries.find(e => e.id === id);
  if (e) { e[field] = value; updateSummary(); }
}

function removeEntry(id) {
  entries = entries.filter(e => e.id !== id);
  const card = document.getElementById(`card-${id}`);
  if (card) card.remove();
  updateSummary();
}

function updateSummary() {
  const total = entries.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const show = entries.length > 0;
  document.getElementById('summaryBar').style.display = show ? 'flex' : 'none';
  document.getElementById('clearBtn').style.display = show ? 'block' : 'none';
  document.getElementById('countLabel').textContent = `${entries.length} Beleg${entries.length !== 1 ? 'e' : ''}`;
  document.getElementById('totalAmount').textContent = total.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
  updateSaveBtn();
}

function updateSaveBtn() {
  const done = entries.filter(e => e.status === 'done');
  document.getElementById('saveBtn').disabled = !accessToken || done.length === 0;
}

function clearAll() {
  if (!confirm('Alle Einträge löschen?')) return;
  entries = [];
  document.getElementById('cardsContainer').innerHTML = '';
  updateSummary();
}

// ── SHEETS ──
async function saveToSheets() {
  if (!accessToken) { showToast('Bitte zuerst mit Google anmelden', 'error'); return; }
  const done = entries.filter(e => e.status === 'done');
  if (!done.length) return;
  showToast('Speichere in Google Sheets…');

  try {
    const sheetId = await getOrCreateSheet();
    const rows = done.map(e => [e.date, 1, parseFloat(e.amount) || 0, e.zahler || '', e.ort, e.note]);
    const res = await fetch(
      `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A:F:append?valueInputOption=USER_ENTERED`,
      { method: 'POST', headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ values: rows }) }
    );
    if (!res.ok) throw new Error(await res.text());
    showToast(`✓ ${rows.length} Eintrag${rows.length !== 1 ? 'e' : ''} gespeichert!`, 'success');
    done.forEach(e => {
      entries = entries.filter(x => x.id !== e.id);
      document.getElementById(`card-${e.id}`)?.remove();
    });
    updateSummary();
  } catch (err) {
    console.error(err);
    showToast('Fehler: ' + err.message, 'error');
  }
}

async function getOrCreateSheet() {
  if (spreadsheetId) return spreadsheetId;
  const q = encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const s = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { 'Authorization': `Bearer ${accessToken}` } })).json();
  if (s.files?.length) { spreadsheetId = s.files[0].id; setSheetLink(); return spreadsheetId; }

  const fq = encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const fd = await (await fetch(`https://www.googleapis.com/drive/v3/files?q=${fq}&fields=files(id)`, { headers: { 'Authorization': `Bearer ${accessToken}` } })).json();
  const folderId = fd.files?.[0]?.id || null;

  const created = await (await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ properties: { title: SHEET_NAME }, sheets: [{ properties: { title: 'Kassenbons' } }] })
  })).json();
  spreadsheetId = created.spreadsheetId;

  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A1:append?valueInputOption=RAW`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${accessToken}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [['Datum', 'Berechnen', 'Betrag', 'Zahler', 'Ort', 'Bemerkung']] })
  });

  if (folderId) {
    await fetch(`https://www.googleapis.com/drive/v3/files/${spreadsheetId}?addParents=${folderId}&fields=id`, {
      method: 'PATCH', headers: { 'Authorization': `Bearer ${accessToken}` }
    });
  }
  setSheetLink();
  return spreadsheetId;
}

function setSheetLink() {
  const hint = document.getElementById('googleHint');
  if (hint && spreadsheetId) {
    hint.innerHTML = 'Einträge in &quot;Receipt Scanner Data&quot; &nbsp;·&nbsp; <a href="https://docs.google.com/spreadsheets/d/' + spreadsheetId + '" target="_blank" style="color:var(--accent2);text-decoration:none;font-weight:500">📊 Sheet öffnen ↗</a>';
  }
}

// ── TOAST ──
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type ? `show ${type}` : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3500);
}

// ── LIGHTBOX ──
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ── INIT ──
initApiKey();
checkAuthCallback();
</script>

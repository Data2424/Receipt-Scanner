<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Bebas+Neue&display=swap');

  :root {
    --bg: #f5f0e8;
    --surface: #ffffff;
    --border: #ddd8cc;
    --accent: #1a1a1a;
    --accent2: #c8440a;
    --text: #1a1a1a;
    --muted: #888;
    --success: #2d7a3a;
    --danger: #c8440a;
    --highlight: #fff3cd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--accent);
    color: white;
    padding: 1.25rem 1.25rem 1rem;
    display: flex;
    align-items: flex-end;
    gap: 1rem;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    line-height: 1;
    color: white;
  }

  header h1 span { color: var(--accent2); }

  #loginBtn {
    background: var(--accent2);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0.5rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: opacity 0.2s;
    white-space: nowrap;
  }
  #loginBtn:hover { opacity: 0.85; }
  #loginBtn.logged-in { background: var(--success); cursor: default; }

  #loginStatus {
    font-size: 0.65rem;
    color: #aaa;
    letter-spacing: 0.05em;
    text-align: right;
    margin-top: 2px;
  }

  main {
    flex: 1;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
  }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: var(--surface);
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent2);
    background: #fff8f5;
  }

  .upload-zone input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

  .upload-zone p { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }
  .upload-zone .hint { margin-top: 0.5rem; font-size: 0.7rem; color: var(--accent2); letter-spacing: 0.05em; }

  /* Cards */
  .scan-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .scan-card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    background: #fafaf8;
  }

  .scan-card img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .scan-card-info { flex: 1; min-width: 0; }

  .scan-card-filename {
    font-size: 0.75rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .scan-card-status { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }
  .scan-card-status.scanning { color: #c8880a; }
  .scan-card-status.done { color: var(--success); }
  .scan-card-status.error { color: var(--danger); }

  .scan-card-body { padding: 0.75rem 1rem; display: flex; flex-direction: column; gap: 0.5rem; }

  .field-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 0.5rem;
    align-items: center;
  }

  .field-label { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; }

  .field-value {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.3rem 0.5rem;
    font-size: 0.8rem;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    width: 100%;
    transition: border-color 0.15s;
  }

  .field-value:focus { outline: none; border-color: var(--accent2); }
  .field-value.amount { color: var(--accent2); font-weight: 500; }

  .remove-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    padding: 0.25rem;
    border-radius: 4px;
    transition: color 0.15s;
    flex-shrink: 0;
  }
  .remove-btn:hover { color: var(--danger); }

  .pulse {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #c8880a;
    animation: pulse 1s infinite;
    margin-right: 0.4rem;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.6); }
  }

  /* Summary */
  .summary-bar {
    background: var(--accent);
    color: white;
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .summary-label { font-size: 0.65rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.07em; }
  .summary-total { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: white; letter-spacing: 0.05em; }
  .summary-count { font-size: 0.65rem; color: #aaa; text-align: right; }

  /* Buttons */
  .btn-primary {
    background: var(--accent2);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0.9rem 1.5rem;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    width: 100%;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    padding: 0.6rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    text-align: center;
  }
  .btn-secondary:hover { border-color: var(--danger); color: var(--danger); }

  .separator { height: 1px; background: var(--border); margin: 0.25rem 0; }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 30px;
    font-size: 0.8rem;
    transition: transform 0.3s ease;
    z-index: 999;
    white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.success { background: var(--success); }
  #toast.error { background: var(--danger); }

  .notice {
    background: var(--highlight);
    border: 1px solid #e8d88a;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    font-size: 0.75rem;
    color: #7a6200;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>BON<span>.</span>SCAN</h1>
  </div>
  <div style="text-align:right">
    <button id="loginBtn" onclick="handleLogin()">🔐 Mit Google anmelden</button>
    <div id="loginStatus">nicht angemeldet</div>
  </div>
</header>

<main>
  <div class="notice" id="loginNotice">
    ⚠️ Bitte zuerst mit Google anmelden, damit Einträge in Google Sheets gespeichert werden können.
  </div>

  <div class="upload-zone" id="uploadZone">
    <input type="file" id="fileInput" accept="image/*" multiple capture="environment">
    <div class="upload-icon">📷</div>
    <p>Foto aufnehmen oder Bild hochladen</p>
    <p class="hint">Mehrere Bons gleichzeitig möglich</p>
  </div>

  <div id="cardsContainer"></div>

  <div class="summary-bar" id="summaryBar" style="display:none">
    <div>
      <div class="summary-label">Gesamt</div>
      <div class="summary-count" id="countLabel">0 Belege</div>
    </div>
    <div class="summary-total" id="totalAmount">0,00 €</div>
  </div>

  <button class="btn-primary" id="saveBtn" disabled onclick="saveToSheets()">
    📊 In Google Sheets speichern
  </button>
  <button class="btn-secondary" id="clearBtn" style="display:none" onclick="clearAll()">
    Alles löschen
  </button>
</main>

<div id="toast"></div>

<script>
// ─── CONFIG ────────────────────────────────────────────────────────────────
const CLIENT_ID = '829620952076-02bue5il4lq8dn8r8n4g7e3t2t31u57a.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file';
const SHEET_NAME = 'Receipt Scanner Data';
const FOLDER_NAME = 'Finance'; // under Library/
const ANTHROPIC_API_URL = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-20250514';

// ─── STATE ──────────────────────────────────────────────────────────────────
let accessToken = null;
let entries = [];
let nextId = 1;
let spreadsheetId = null;

// ─── GOOGLE AUTH ────────────────────────────────────────────────────────────
function handleLogin() {
  if (accessToken) return;
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: window.location.origin + window.location.pathname,
    response_type: 'token',
    scope: SCOPES,
    include_granted_scopes: 'true'
  });
  window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params;
}

function checkAuthCallback() {
  const hash = window.location.hash;
  if (!hash) return;
  const params = new URLSearchParams(hash.replace('#', '?'));
  const token = params.get('access_token');
  if (token) {
    accessToken = token;
    window.history.replaceState({}, document.title, window.location.pathname);
    onLoggedIn();
  }
}

function onLoggedIn() {
  document.getElementById('loginBtn').textContent = '✓ Angemeldet';
  document.getElementById('loginBtn').classList.add('logged-in');
  document.getElementById('loginStatus').textContent = 'Google Sheets bereit';
  document.getElementById('loginNotice').style.display = 'none';
  updateSaveBtn();
}

// ─── FILE HANDLING ──────────────────────────────────────────────────────────
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');

uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('drag-over');
  handleFiles([...e.dataTransfer.files]);
});
fileInput.addEventListener('change', () => { handleFiles([...fileInput.files]); fileInput.value = ''; });

function handleFiles(files) {
  files.filter(f => f.type.startsWith('image/')).forEach(processFile);
}

async function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function toThumb(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.readAsDataURL(file);
  });
}

// ─── SCAN ───────────────────────────────────────────────────────────────────
async function processFile(file) {
  const id = nextId++;
  const thumb = await toThumb(file);
  const entry = { id, filename: file.name, thumb, date: '', vendor: '', amount: '', ort: '', note: '', status: 'scanning' };
  entries.push(entry);
  renderCard(entry);
  updateSummary();

  try {
    const b64 = await toBase64(file);
    const res = await fetch(ANTHROPIC_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: file.type || 'image/jpeg', data: b64 } },
            { type: 'text', text: `Analysiere diesen Kassenbon. Antworte NUR mit einem JSON-Objekt, ohne Markdown, ohne Erklärung:
{
  "date": "YYYY-MM-DD",
  "vendor": "Marktname z.B. Netto, Lidl, Aldi, Rewe, Famila, Edeka, Penny, Kaufland",
  "amount": "Gesamtbetrag als Zahl z.B. 9.32",
  "ort": "Stadt oder Ort des Marktes",
  "handschrift": "handschriftliche Notizen auf dem Bon falls vorhanden, sonst leer"
}` }
          ]
        }]
      })
    });

    const data = await res.json();
    const raw = data.content?.[0]?.text || '{}';
    const parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());

    entry.date = parsed.date || '';
    entry.vendor = parsed.vendor || '';
    entry.amount = parsed.amount ? String(parsed.amount) : '';
    entry.ort = parsed.ort || '';
    entry.note = parsed.handschrift ? `Einkauf - ${parsed.handschrift}` : 'Einkauf';
    entry.status = 'done';

  } catch (err) {
    entry.status = 'error';
    entry.note = 'Scan fehlgeschlagen';
    console.error(err);
  }

  updateCard(entry);
  updateSummary();
}

// ─── RENDER ─────────────────────────────────────────────────────────────────
function renderCard(entry) {
  const div = document.createElement('div');
  div.className = 'scan-card';
  div.id = `card-${entry.id}`;
  div.innerHTML = cardHTML(entry);
  document.getElementById('cardsContainer').appendChild(div);
}

function updateCard(entry) {
  const div = document.getElementById(`card-${entry.id}`);
  if (div) div.innerHTML = cardHTML(entry);
}

function cardHTML(entry) {
  const statusText = {
    scanning: `<span class="pulse"></span>Wird gescannt…`,
    done: '✓ Erfasst',
    error: '✗ Fehler beim Scannen'
  }[entry.status];

  const fields = entry.status === 'scanning' ? '' : `
    <div class="separator"></div>
    <div class="field-row">
      <span class="field-label">Datum</span>
      <input class="field-value" type="date" value="${entry.date}" onchange="updateField(${entry.id},'date',this.value)">
    </div>
    <div class="field-row">
      <span class="field-label">Zahler</span>
      <input class="field-value" type="text" value="${esc(entry.vendor)}" placeholder="Marktname" onchange="updateField(${entry.id},'vendor',this.value)">
    </div>
    <div class="field-row">
      <span class="field-label">Betrag €</span>
      <input class="field-value amount" type="number" step="0.01" value="${entry.amount}" placeholder="0.00" onchange="updateField(${entry.id},'amount',this.value)">
    </div>
    <div class="field-row">
      <span class="field-label">Ort</span>
      <input class="field-value" type="text" value="${esc(entry.ort)}" placeholder="Stadt" onchange="updateField(${entry.id},'ort',this.value)">
    </div>
    <div class="field-row">
      <span class="field-label">Bemerkung</span>
      <input class="field-value" type="text" value="${esc(entry.note)}" placeholder="Einkauf" onchange="updateField(${entry.id},'note',this.value)">
    </div>
  `;

  return `
    <div class="scan-card-header">
      <img src="${entry.thumb}" alt="Bon">
      <div class="scan-card-info">
        <div class="scan-card-filename">${esc(entry.filename)}</div>
        <div class="scan-card-status ${entry.status}">${statusText}</div>
      </div>
      <button class="remove-btn" onclick="removeEntry(${entry.id})">✕</button>
    </div>
    ${entry.status !== 'scanning' ? `<div class="scan-card-body">${fields}</div>` : ''}
  `;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function updateField(id, field, value) {
  const e = entries.find(e => e.id === id);
  if (e) { e[field] = value; updateSummary(); }
}

function removeEntry(id) {
  entries = entries.filter(e => e.id !== id);
  const card = document.getElementById(`card-${id}`);
  if (card) card.remove();
  updateSummary();
}

function updateSummary() {
  const done = entries.filter(e => e.status !== 'scanning');
  const total = entries.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const show = entries.length > 0;

  document.getElementById('summaryBar').style.display = show ? 'flex' : 'none';
  document.getElementById('clearBtn').style.display = show ? 'block' : 'none';
  document.getElementById('countLabel').textContent = `${entries.length} Beleg${entries.length !== 1 ? 'e' : ''}`;
  document.getElementById('totalAmount').textContent = total.toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });

  updateSaveBtn();
}

function updateSaveBtn() {
  const done = entries.filter(e => e.status === 'done');
  document.getElementById('saveBtn').disabled = !accessToken || done.length === 0;
}

function clearAll() {
  if (!confirm('Alle Einträge löschen?')) return;
  entries = [];
  document.getElementById('cardsContainer').innerHTML = '';
  updateSummary();
}

// ─── GOOGLE SHEETS ──────────────────────────────────────────────────────────
async function saveToSheets() {
  if (!accessToken) { showToast('Bitte zuerst anmelden', 'error'); return; }

  const done = entries.filter(e => e.status === 'done');
  if (!done.length) return;

  showToast('Speichere in Google Sheets…');

  try {
    const sheetId = await getOrCreateSheet();

    const rows = done.map(e => [
      e.date,
      1,
      parseFloat(e.amount) || 0,
      e.vendor,
      e.ort,
      e.note
    ]);

    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/A:F:append?valueInputOption=USER_ENTERED`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${accessToken}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ values: rows })
    });

    showToast(`✓ ${rows.length} Eintrag${rows.length !== 1 ? 'e' : ''} gespeichert!`, 'success');

    // Remove saved entries
    const savedIds = done.map(e => e.id);
    savedIds.forEach(id => {
      entries = entries.filter(e => e.id !== id);
      const card = document.getElementById(`card-${id}`);
      if (card) card.remove();
    });
    updateSummary();

  } catch (err) {
    console.error(err);
    showToast('Fehler beim Speichern', 'error');
  }
}

async function getOrCreateSheet() {
  if (spreadsheetId) return spreadsheetId;

  // Search for existing sheet
  const q = encodeURIComponent(`name='${SHEET_NAME}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { 'Authorization': `Bearer ${accessToken}` }
  });
  const searchData = await searchRes.json();

  if (searchData.files && searchData.files.length > 0) {
    spreadsheetId = searchData.files[0].id;
    return spreadsheetId;
  }

  // Find Library/Finance folder
  const folderRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(`name='${FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`)}&fields=files(id,name)`, {
    headers: { 'Authorization': `Bearer ${accessToken}` }
  });
  const folderData = await folderRes.json();
  const folderId = folderData.files?.[0]?.id || null;

  // Create new sheet
  const createRes = await fetch('https://sheets.googleapis.com/v4/spreadsheets', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      properties: { title: SHEET_NAME },
      sheets: [{ properties: { title: 'Kassenbons' } }]
    })
  });
  const created = await createRes.json();
  spreadsheetId = created.spreadsheetId;

  // Add header row
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A1:append?valueInputOption=RAW`, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${accessToken}`,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ values: [['Datum', 'Berechnen', 'Betrag', 'Zahler', 'Ort', 'Bemerkung']] })
  });

  // Move to Finance folder if found
  if (folderId) {
    await fetch(`https://www.googleapis.com/drive/v3/files/${spreadsheetId}?addParents=${folderId}&fields=id`, {
      method: 'PATCH',
      headers: { 'Authorization': `Bearer ${accessToken}` }
    });
  }

  return spreadsheetId;
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type ? `show ${type}` : 'show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = ''; }, 3000);
}

// ─── INIT ────────────────────────────────────────────────────────────────────
checkAuthCallback();
</script>
</body>
</html>
